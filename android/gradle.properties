org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Fix multi-drive root issue on Windows and ensure clean cache behavior
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false
kotlin.incremental.useClasspathSnapshot=false

# Prevent strict JVM-target mismatch failure for third-party plugins with mixed Java/Kotlin targets
kotlin.jvm.target.validation.mode=warning
